<svg width="200" height="260" viewBox="0 0 200 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Wooden Voting Card -->
  <rect x="10" y="10" width="180" height="240" rx="18" fill="#FEF08A" stroke="#000000" stroke-width="6" />
  <rect x="25" y="25" width="150" height="60" rx="10" fill="#D97706" stroke="#000000" stroke-width="4" />
  <text x="100" y="62" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="900" font-family="sans-serif">BALLOT</text>

  <!-- Vote Target Box -->
  <rect x="25" y="105" width="150" height="120" rx="12" fill="#FFFFFF" stroke="#000000" stroke-width="5" />
  <text x="100" y="150" text-anchor="middle" fill="#EF4444" font-size="18" font-weight="900" font-family="sans-serif">TARGET</text>
  <line x1="45" y1="180" x2="155" y2="180" stroke="#000000" stroke-width="4" stroke-linecap="round" />
</svg>
