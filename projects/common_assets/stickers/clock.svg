<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Clock circle -->
  <circle cx="50" cy="50" r="42" fill="#FFFFFF" stroke="#000000" stroke-width="7" />
  <!-- Center dot -->
  <circle cx="50" cy="50" r="5" fill="#000000" />
  <!-- Clock hands -->
  <line x1="50" y1="50" x2="50" y2="22" stroke="#000000" stroke-width="7" stroke-linecap="round" />
  <line x1="50" y1="50" x2="72" y2="50" stroke="#000000" stroke-width="6" stroke-linecap="round" />
  <!-- Small clock ticks -->
  <line x1="50" y1="12" x2="50" y2="18" stroke="#000000" stroke-width="4" />
  <line x1="50" y1="88" x2="50" y2="82" stroke="#000000" stroke-width="4" />
  <line x1="12" y1="50" x2="18" y2="50" stroke="#000000" stroke-width="4" />
  <line x1="88" y1="50" x2="82" y2="50" stroke="#000000" stroke-width="4" />
</svg>
