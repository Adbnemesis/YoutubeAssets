<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brawl Stars VFX Preview</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a0f;
      color: #e8e8f0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
    }

    .header {
      background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
      padding: 24px 32px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .header h1 {
      font-size: 24px;
      font-weight: 700;
      background: linear-gradient(135deg, #00d2ff, #3a7bd5);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header p {
      color: #888;
      font-size: 14px;
      margin-top: 4px;
    }

    .controls {
      display: flex;
      gap: 12px;
      padding: 16px 32px;
      background: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      flex-wrap: wrap;
      align-items: center;
    }

    .controls label {
      font-size: 13px;
      color: #aaa;
    }

    .controls select,
    .controls button,
    .controls input {
      background: #1a1a2e;
      color: #ddd;
      border: 1px solid #333;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }

    .controls button:hover {
      background: #2a2a4e;
    }

    .controls button.active {
      background: #3a7bd5;
      border-color: #3a7bd5;
      color: #fff;
    }

    .preview-area {
      display: flex;
      gap: 24px;
      padding: 24px 32px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .scene-card {
      background: #111120;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
      width: fit-content;
    }

    .scene-card h3 {
      padding: 12px 16px;
      font-size: 14px;
      color: #bbb;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .canvas-wrapper {
      position: relative;
      width: 540px;
      height: 540px;
      background: repeating-conic-gradient(#1a1a2e 0% 25%, #15152a 0% 50%) 50% / 20px 20px;
      overflow: hidden;
    }

    .canvas-wrapper.dark-bg {
      background: #0a0a12;
    }

    .canvas-wrapper.game-bg {
      background: linear-gradient(135deg, #8b6f47, #a0825a, #7d6342);
    }

    .frame-info {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.7);
      color: #aaa;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 4px;
      font-family: monospace;
    }

    .effect-layer {
      position: absolute;
      pointer-events: none;
      image-rendering: auto;
    }

    .effect-layer.blend-screen {
      mix-blend-mode: screen;
    }

    .effect-layer.blend-add {
      mix-blend-mode: screen;
    }

    .grid-view {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      padding: 24px 32px;
    }

    .grid-cell {
      background: #111120;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.06);
      text-align: center;
    }

    .grid-cell .part-name {
      font-size: 11px;
      color: #888;
      padding: 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      font-family: monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .grid-cell canvas {
      display: block;
      margin: 0 auto;
      background: repeating-conic-gradient(#1a1a2e 0% 25%, #15152a 0% 50%) 50% / 10px 10px;
    }

    .tab-bar {
      display: flex;
      gap: 0;
      padding: 0 32px;
      background: rgba(255, 255, 255, 0.02);
    }

    .tab {
      padding: 10px 20px;
      font-size: 13px;
      color: #888;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }

    .tab:hover {
      color: #ccc;
    }

    .tab.active {
      color: #3a7bd5;
      border-bottom-color: #3a7bd5;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>⚡ Brawl Stars VFX Preview</h1>
    <p>Game-accurate effects extracted via sc-editor reference renderer</p>
  </div>

  <div class="tab-bar">
    <div class="tab active" data-tab="scenes">Attack Scenes</div>
    <div class="tab" data-tab="parts">Individual Parts</div>
  </div>

  <div class="controls">
    <label>Brawler:</label>
    <select id="brawlerSelect">
      <option value="gale">Gale</option>

      <option value="dark">Dark</option>

    <button id="playBtn" class="active">▶ Play</button>

  </div>

  <div id="scenesTab" class="preview-area">
    <div class="scene-card">
      <h3 id="sceneTitle">Gale Attack — "Polar Vortex"</h3>
      <div class="canvas-wrapper" id="sceneCanvas">
        <div class="frame-info" id="frameInfo">Frame: 0 / 0</div>
      </div>
    </div>
  </div>

  <div id="partsTab" class="grid-view" style="display:none"></div>

    // Load manifest
    async function loadManifest(brawler, part) {
      const key = `${brawler}/${part}`;
      if (manifestCache[key]) return manifestCache[key];
      try {
        const res = await fetch(`${BASE}/${brawler}/${part}/manifest.json`);
        if (!res.ok) return null;
        const data = await res.json();
        manifestCache[key] = data;
        return data;
      } catch { return null; }
    }

    // Load frame image
    function loadImage(src) {
      if (imageCache[src]) return Promise.resolve(imageCache[src]);
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => { imageCache[src] = img; resolve(img); };
        img.onerror = () => resolve(null);
        img.src = src;
      });
    }

    // Easing
    function easeOut(t) { return 1 - Math.pow(1 - t, 2); }
    function lerp(a, b, t) { return a + (b - a) * t; }

    // Render a single spawn at the given frame
    async function renderSpawn(ctx, brawler, spawn, frame) {
      const t = frame - spawn.start;
      if (t < 0) return;

      const manifest = await loadManifest(brawler, spawn.part);
      if (!manifest || !manifest.frameCount) return;

      const total = manifest.frameCount;
      const elapsed = Math.max(0, Math.floor(t));
      const loop = spawn.loop || false;
      // Moving projectiles keep looping their short clip for the whole flight;
      // static one-shots play once then hide (unless `hold` keeps the last frame).
      if (spawn.move) {
        if (t >= spawn.move.dur + (spawn.linger || 0)) return;
      } else if (!loop && elapsed >= total) {
        if (!spawn.hold) return;
      }
      const idx = (spawn.move || loop)
        ? elapsed % total
        : Math.min(elapsed, total - 1);

      const src = `${BASE}/${brawler}/${spawn.part}/frame_${String(idx).padStart(4, '0')}.png`;
      const img = await loadImage(src);
      if (!img) return;

      const uni = manifest.scale || 1;
      const scl = spawn.scale || 1;
      // Draw in game-sized pixels and honor the effect's anchor (matches ScEffect.tsx).
      const w = (img.width / uni) * scl;
      const h = (img.height / uni) * scl;
      const ax = (manifest.anchor.x / uni) * scl;
      const ay = (manifest.anchor.y / uni) * scl;
      const opacity = spawn.opacity ?? 1;
      const rotate = spawn.rotate || 0;

      let x, y;
      if (spawn.move) {
        const dur = spawn.move.dur || 1;
        const prog = Math.min(1, t / dur);
        const e = easeOut(prog);
        if (spawn.move.cx !== undefined && spawn.move.cy !== undefined) {
          x = (1 - e) * (1 - e) * spawn.move.fx + 2 * (1 - e) * e * spawn.move.cx + e * e * spawn.move.tx;
          y = (1 - e) * (1 - e) * spawn.move.fy + 2 * (1 - e) * e * spawn.move.cy + e * e * spawn.move.ty;
        } else {
          x = lerp(spawn.move.fx, spawn.move.tx, e);
          y = lerp(spawn.move.fy, spawn.move.ty, e);
        }
        if (spawn.move.arc) {
          y -= Math.sin(e * Math.PI) * spawn.move.arc;
        }
      } else {
        x = spawn.x || 0;
        y = spawn.y || 0;
      }

      ctx.save();
      ctx.globalAlpha = opacity * (spawn.move ? (1 - Math.pow(Math.min(1, t / (spawn.move?.dur || 30)), 4) * 0.7) : 1);
      if (spawn.blend === 'screen') ctx.globalCompositeOperation = 'screen';
      ctx.translate(x, y);
      if (rotate) ctx.rotate(rotate * Math.PI / 180);
      if (spawn.filter) ctx.filter = spawn.filter;
      ctx.drawImage(img, -ax, -ay, w, h);
      ctx.restore();
    }

    // Main render loop
    let currentBrawler = 'gale';
    let currentSceneKey = 'attack';
    let currentAudio = null;

    async function render(timestamp) {
      if (!lastTimestamp) lastTimestamp = timestamp;
      const delta = timestamp - lastTimestamp;

      if (playing && delta > 33 / speed) { // ~30fps
        currentFrame++;
        lastTimestamp = timestamp;
      }

      const scene = SCENES[currentBrawler]?.[currentSceneKey];
      if (!scene) { animationId = requestAnimationFrame(render); return; }

      if (currentFrame >= scene.duration) {
        if (playing) currentFrame = 0;
      }
      
      // Play audio on frame 0
      if (playing && currentFrame === 0) {
        if (currentAudio) {
            currentAudio.pause();
            currentAudio.currentTime = 0;
        }
        
        let audioName = '';
        if (currentSceneKey === 'attack') audioName = `${currentBrawler}_atk_01`;
        if (currentSceneKey === 'super') {
            audioName = `${currentBrawler}_ulti_01`;
            if (currentBrawler === 'ash') audioName = `ash_rats_01`;
            if (currentBrawler === 'kit') audioName = `kit_ulti_atk_01`;
        }
        
        currentAudio = new Audio(`commonassets/sound_effects/${audioName}.ogg`);
        // Fallback to mp3 if ogg doesn't exist
        currentAudio.onerror = () => {
            currentAudio = new Audio(`commonassets/sound_effects/${audioName}.mp3`);
            currentAudio.play().catch(e => console.log('Audio play failed:', e));
        };
        currentAudio.play().catch(e => console.log('Audio play failed:', e));
      }

      const container = document.getElementById('sceneCanvas');
      let canvas = container.querySelector('canvas');
      if (!canvas) {
        canvas = document.createElement('canvas');
        canvas.width = 540; canvas.height = 540;
        canvas.style.width = '540px'; canvas.style.height = '540px';
        container.insertBefore(canvas, container.firstChild);
      }

      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, 540, 540);

      // Render all spawns
      for (const spawn of scene.spawns) {
        await renderSpawn(ctx, currentBrawler, spawn, currentFrame);
      }

      document.getElementById('frameInfo').textContent = `Frame: ${currentFrame} / ${scene.duration}`;
      document.getElementById('sceneTitle').textContent = scene.title;

      animationId = requestAnimationFrame(render);
    }

    // Parts grid view
    async function showParts(brawler) {
      const grid = document.getElementById('partsTab');
      grid.innerHTML = '<p style="color:#888;padding:12px">Loading parts...</p>';

      try {
        const res = await fetch(`${BASE}/${brawler}/index.json`);
        if (!res.ok) { grid.innerHTML = '<p style="color:#f88">No index.json found. Run extraction first.</p>'; return; }
        const index = await res.json();

        grid.innerHTML = '';
        for (const [name, manifest] of Object.entries(index)) {
          const cell = document.createElement('div');
          cell.className = 'grid-cell';
          cell.innerHTML = `<div class="part-name">${name}</div>`;

          const cv = document.createElement('canvas');
          const size = 160;
          cv.width = size; cv.height = size;
          cv.style.width = size + 'px'; cv.style.height = size + 'px';
          cell.appendChild(cv);
          grid.appendChild(cell);

          // Animate this cell
          let frame = 0;
          const total = manifest.frameCount || 1;
          const animate = async () => {
            const ctx = cv.getContext('2d');
            ctx.clearRect(0, 0, size, size);
            const src = `${BASE}/${brawler}/${name}/frame_${String(frame % total).padStart(4, '0')}.png`;
            const img = await loadImage(src);
            if (img) {
              const sc = Math.min(size / img.width, size / img.height) * 0.9;
              const w = img.width * sc, h = img.height * sc;
              ctx.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
            }
            frame++;
            setTimeout(animate, 100);
          };
          animate();
        }
      } catch (e) {
        grid.innerHTML = `<p style="color:#f88">Error: ${e.message}</p>`;
      }
    }

    // Populate the scene dropdown from the selected brawler's scene keys
    const SCENE_LABELS = {
      attack: 'Attack',
      super: 'Super',
      super_enemy: 'Super (Enemy attach)',
    };
    function populateScenes(brawler) {
      const sel = document.getElementById('sceneSelect');
      const scenes = SCENES[brawler] || {};
      const keys = Object.keys(scenes);
      sel.innerHTML = '';
      keys.forEach((k) => {
        const opt = document.createElement('option');
        opt.value = k;
        opt.textContent = SCENE_LABELS[k] || k;
        sel.appendChild(opt);
      });
      if (keys.includes(currentSceneKey)) {
        sel.value = currentSceneKey;
      } else {
        currentSceneKey = keys[0] || 'attack';
        sel.value = currentSceneKey;
      }
    }

    // Event handlers
    document.getElementById('brawlerSelect').onchange = (e) => {
      currentBrawler = e.target.value;
      currentFrame = 0;
      populateScenes(currentBrawler);
      const tab = document.querySelector('.tab.active');
      if (tab?.dataset.tab === 'parts') showParts(currentBrawler);
    };

    document.getElementById('sceneSelect').onchange = (e) => {
      currentSceneKey = e.target.value;
      currentFrame = 0;
    };

    document.getElementById('bgSelect').onchange = (e) => {
      const wrapper = document.querySelector('.canvas-wrapper');
      wrapper.className = 'canvas-wrapper';
      if (e.target.value === 'dark') wrapper.classList.add('dark-bg');
      if (e.target.value === 'game') wrapper.classList.add('game-bg');
    };

    document.getElementById('speedSlider').oninput = (e) => {
      speed = parseFloat(e.target.value);
      document.getElementById('speedLabel').textContent = speed.toFixed(1) + 'x';
    };

    document.getElementById('playBtn').onclick = () => {
      playing = !playing;
      const btn = document.getElementById('playBtn');
      btn.textContent = playing ? '▶ Play' : '⏸ Pause';
      btn.classList.toggle('active', playing);
    };

    document.getElementById('resetBtn').onclick = () => {
      currentFrame = 0;
      lastTimestamp = 0;
    };

    document.querySelectorAll('.tab').forEach(tab => {
      tab.onclick = () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        const id = tab.dataset.tab;
        document.getElementById('scenesTab').style.display = id === 'scenes' ? 'flex' : 'none';
        document.getElementById('partsTab').style.display = id === 'parts' ? 'grid' : 'none';
        if (id === 'parts') showParts(currentBrawler);
      };
    });

    // Start
    populateScenes(currentBrawler);
    animationId = requestAnimationFrame(render);
  </script>
</body>

</html>
